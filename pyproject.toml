[project]
name = "mediamonitor"
version = "0.1.0"
description = "Track news attention to an organisation or topic, per country, using GDELT."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=1.8"]
dev = ["pytest"]

[project.scripts]
mediamonitor = "mediamonitor.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mediamonitor"]

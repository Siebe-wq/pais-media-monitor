# Fetches news data from GDELT once a week, rebuilds the report and saves
# both back into this repository (data/ and docs/).
# Run it by hand: GitHub > Actions > "Fetch media data" > "Run workflow".
name: Fetch media data

on:
  schedule:
    - cron: "17 5 * * 1"  # Mondays 05:17 UTC
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to fetch (article lists go back at most ~90)"
        default: "14"
      sources:
        description: "Which sources to fetch"
        type: choice
        options: [all, gdelt, mediacloud]
        default: all

permissions:
  contents: write

concurrency:
  group: fetch-media-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: "1"  # show progress in the log as it happens
      DAYS: ${{ inputs.days || '14' }}
      SOURCES: ${{ inputs.sources || 'all' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MC_API_KEY: ${{ secrets.MC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e '.[llm,mediacloud]'

      # Only runs if the repository has an MC_API_KEY secret. Runs first because
      # it is quick; GDELT can take up to two hours when it is rate-limiting.
      - name: Fetch from Media Cloud
        if: env.MC_API_KEY != '' && env.SOURCES != 'gdelt'
        continue-on-error: true
        run: mediamonitor -c config.toml fetch-mediacloud --days "$DAYS"

      - name: Fetch from GDELT
        if: env.SOURCES != 'mediacloud'
        # Stops asking GDELT after 120 minutes; whatever was fetched is still saved.
        run: mediamonitor -c config.toml fetch --days "$DAYS" --max-minutes 120

      # Only runs if you add an ANTHROPIC_API_KEY secret to the repository.
      # Capped per run to keep costs predictable.
      - name: Label new articles with Claude
        if: env.ANTHROPIC_API_KEY != ''
        run: mediamonitor -c config.toml classify --limit 200

      - name: Build report
        if: always()
        run: |
          mediamonitor -c config.toml report --out docs
          cp docs/report.html docs/index.html

      - name: Save results to the repository
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "Nothing new to save."
          else
            git commit -m "Update media data ($(date -u +%Y-%m-%d))"
            # Someone may have pushed code while this ran; put our data on top.
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
